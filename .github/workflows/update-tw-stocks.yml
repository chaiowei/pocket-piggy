name: 更新台股代號與收盤價

on:
  schedule:
    - cron: '40 8 * * 1-5'   # 台灣時間 16:40（週一到週五，收盤後）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-tw-stocks.mjs
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tw-stocks.json
          git diff --cached --quiet || (git commit -m "data: 更新台股收盤價" && git push)
